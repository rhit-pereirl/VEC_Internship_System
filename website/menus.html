    <!-- Menu Item Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addModalLabel">Add Menu</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-menu-form" class="needs-validation" novalidate>
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text">Menu Name</span>
                            <input id="menu-name" type="text" class="form-control" required>
                        </div>
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="menu-image">Menu Image</label>
                            <input type="file" class="form-control" id="menu-image">
                        </div>
                        <div class="input-group">
                            <span class="input-group-text">Menu Description</span>
                            <textarea id="menu-description" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>

    <div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addItemModalLabel">Add Menu Item</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-item-form">
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text">Item Name</span>
                            <input id="item-name" type="text" class="form-control" required>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">Category</span>
                            <input id="item-category" type="text" class="form-control" required>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text">Amount</span>
                            <input id="item-amount" type="number" min="0" step="0.01" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const menusGrid = document.getElementById('menus-grid');
        const addMenuForm = document.getElementById('add-menu-form');

        async function loadMenus() {
            try {
                const response = await fetch('/api/menus');
                const menus = await response.json();
                const menusWithItems = await Promise.all(menus.map(async (menu) => {
                    const itemsResponse = await fetch(`/api/menus/${menu.id}/items`);
                    const items = itemsResponse.ok ? await itemsResponse.json() : [];
                    return { ...menu, items };
                }));
                renderMenus(menusWithItems);
            } catch (error) {
                console.error('Unable to load menus', error);
            }
        }

        function renderMenus(menus) {
            const cards = menus.map((menu) => `
                <div class="col">
                    <div class="card card-tile h-100">
                        <img src="${menu.image || './Images/cruzeiro_pic.jpg'}" class="card-img-top" alt="${menu.name}" style="height: 180px; object-fit: cover;">
                        <div class="card-body text-center">
                            <h5 class="card-title">${menu.name}</h5>
                            <p class="card-text">${menu.description || 'No description yet.'}</p>
                            <div class="small text-muted mb-3">
                                ${menu.items.length ? menu.items.map((item) => `<div>${item.name} — ${item.category} — ${item.price ?? item.amount}</div>`).join('') : '<div>No items added yet.</div>'}
                            </div>
                            <div class="d-flex gap-2 justify-content-center">
                                <a class="btn btn-primary btn-sm" href="menu-edit.html?menuId=${encodeURIComponent(menu.id)}">Edit Menu</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            menusGrid.innerHTML = `${cards}<div class="col"><div class="card card-tile add-card-tile"><button class="btn btn-primary d-flex align-items-center justify-content-center w-100 h-100" data-bs-toggle="modal" data-bs-target="#addModal">+</button></div></div>`;
        }

        addMenuForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const name = document.getElementById('menu-name').value.trim();
            const description = document.getElementById('menu-description').value.trim();

            if (!name) return;

            try {
                const response = await fetch('/api/menus', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, image: '' })
                });

                if (response.ok) {
                    addMenuForm.reset();
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
                    modal?.hide();
                    await loadMenus();
                }
            } catch (error) {
                console.error('Unable to save menu', error);
            }
        });

        // No modal action is needed here; menu cards now navigate to the menu edit page.

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadMenus);
        } else {
            loadMenus();
        }
    </script>
